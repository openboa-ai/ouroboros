name: npm-security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '49 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audit:
    name: npm-audit-${{ matrix.name }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mac
            directory: apps/mac
          - name: calibration
            directory: design/mac-calibration
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the audit runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.21.0'
          package-manager-cache: false

      - name: Verify the frozen dependency graph without lifecycle scripts
        working-directory: ${{ matrix.directory }}
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Audit all locked dependencies against current advisories
        working-directory: ${{ matrix.directory }}
        shell: bash
        run: |
          set -euo pipefail
          npm audit --package-lock-only --ignore-scripts --audit-level=low --json | tee npm-audit.json

      - name: Retain the audit result, including findings and registry errors
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-audit-${{ matrix.name }}-${{ github.run_attempt }}
          path: ${{ matrix.directory }}/npm-audit.json
          if-no-files-found: error
          retention-days: 30
