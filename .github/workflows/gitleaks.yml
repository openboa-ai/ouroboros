name: gitleaks

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "37 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitleaks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scan:
    name: scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        shell: bash
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          checksums="gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          base_url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"

          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --output "$archive" "${base_url}/${archive}"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --output "$checksums" "${base_url}/${checksums}"
          grep " ${archive}$" "$checksums" | sha256sum --check --strict

          mkdir -p "${RUNNER_TEMP}/gitleaks-bin"
          tar -xzf "$archive" -C "${RUNNER_TEMP}/gitleaks-bin" gitleaks
          echo "${RUNNER_TEMP}/gitleaks-bin" >> "$GITHUB_PATH"

      - name: Run Gitleaks
        run: gitleaks git --no-banner --redact .
