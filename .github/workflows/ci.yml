name: repository-integrity

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-integrity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  repository-integrity:
    name: repository-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Check required repository files
        shell: bash
        run: |
          set -euo pipefail
          test -s README.md
          test -s SECURITY.md
          test -s CODEOWNERS

      - name: Reject tracked local secrets and private keys
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          while IFS= read -r -d '' path; do
            case "$path" in
              .env.example|*/.env.example)
                ;;
              .env|*/.env|.env.*|*/.env.*|.envrc|*/.envrc|*.pem|*.key|*.p12|*.pfx|id_rsa|*/id_rsa|id_dsa|*/id_dsa|id_ecdsa|*/id_ecdsa|id_ed25519|*/id_ed25519)
                echo "Forbidden tracked secret path: $path" >&2
                failed=1
                ;;
            esac
          done < <(git ls-files -z)
          test "$failed" -eq 0

      - name: Check diff whitespace
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --check "$PR_BASE_SHA" "$PR_HEAD_SHA"
          else
            git diff-tree --check --no-commit-id --root -r HEAD
          fi
