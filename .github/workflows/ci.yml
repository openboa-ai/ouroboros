name: repository-integrity

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-integrity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  repository-integrity:
    name: repository-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check required repository files
        shell: bash
        run: |
          set -euo pipefail
          test -s README.md
          test -s SECURITY.md
          test -s CODEOWNERS
          test -s CORE_DOCTRINE.md
          test -s WHITEPAPER.md
          test -s AGENTS.md
          test -s SOVEREIGN.md

      - name: Reject tracked local secrets and private keys
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          while IFS= read -r -d '' path; do
            case "$path" in
              .env.example|*/.env.example)
                ;;
              .env|*/.env|.env.*|*/.env.*|.envrc|*/.envrc|*.pem|*.key|*.p12|*.pfx|id_rsa|*/id_rsa|id_dsa|*/id_dsa|id_ecdsa|*/id_ecdsa|id_ed25519|*/id_ed25519)
                echo "Forbidden tracked secret path: $path" >&2
                failed=1
                ;;
            esac
          done < <(git ls-files -z)
          test "$failed" -eq 0

      - name: Check diff whitespace
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.event.after }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --check "$PR_BASE_SHA" "$PR_HEAD_SHA"
          elif [[ "$EVENT_NAME" == "push" ]]; then
            if [[ "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
              git diff-tree --check --no-commit-id --root -r "$PUSH_AFTER_SHA"
            else
              git diff --check "$PUSH_BEFORE_SHA" "$PUSH_AFTER_SHA"
            fi
          else
            git diff-tree --check --no-commit-id --root -r HEAD
          fi
