[workspace]
members = ["crates/contracts", "crates/transport", "crates/core", "crates/gateway", "crates/cli", "crates/runtime", "crates/resources"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "1"
async-stream = "0.3"
axum = "0.8"
bytes = "1"
clap = { version = "4", features = ["derive"] }
http-body-util = "0.1"
hex = "0.4.3"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "uuid", "json", "migrate", "macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time", "process", "signal", "fs", "sync"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tower = { version = "0.5", features = ["util", "limit"] }
uuid = { version = "1", features = ["v4", "serde"] }

bollard = { version = "=0.21.1", default-features = false, features = ["pipe"] }
futures-util = "0.3"
