[[test]]
name = "programs"
path = "tests/programs.rs"
required-features = ["postgres-tests"]

[[test]]
name = "receipt_recovery"
path = "tests/receipt_recovery.rs"
required-features = ["postgres-tests"]

[[test]]
name = "workspaces"
path = "tests/workspaces.rs"
required-features = ["postgres-tests"]

[[test]]
name = "notifications"
path = "tests/notifications.rs"
